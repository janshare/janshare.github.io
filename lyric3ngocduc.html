<style>
  .notice-wrapper {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
  }

  .new-link-notice {
    width: 100%;
    max-width: 620px;
    padding: 28px 26px;
    border-radius: 20px;
    background: linear-gradient(135deg, #fff7f9, #ffffff);
    border: 1px solid #ffd9e2;
    box-shadow: 0 12px 35px rgba(255, 92, 130, 0.15);
    font-family: Arial, sans-serif;
    text-align: center;
    box-sizing: border-box;
  }

  .notice-icon {
    width: 60px;
    height: 60px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff5c82, #ff8fab);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    box-shadow: 0 8px 20px rgba(255, 92, 130, .25);
  }

  .new-link-notice h3 {
    margin: 0 0 10px;
    color: #333;
    font-size: 22px;
  }

  .new-link-notice p {
    margin: 0;
    color: #777;
    font-size: 15px;
    line-height: 1.7;
  }

  .highlight {
    display: inline-block;
    margin-top: 14px;
    padding: 9px 15px;
    border-radius: 10px;
    background: #fff0f4;
    color: #ff4f78;
    font-weight: 600;
    font-size: 14px;
  }
</style>

<div class="notice-wrapper">
  <div class="new-link-notice">
    <div class="notice-icon">🔗</div>
    <h3>Link bài viết đã được thay đổi sang địa chỉ mới. Ngọc Đức, em  liên hệ qua fb để nhận link mới nhé</h3>
  </div>
</div>
